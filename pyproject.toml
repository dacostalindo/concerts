[project]
name = "concert-digest"
version = "0.1.0"
description = "Critics' picks from Pitchfork, Stereogum & co., matched against Belgian concerts on Concertje, delivered as an email."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
concert-digest = "concert_digest.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["concert_digest*"]

[tool.setuptools.package-data]
concert_digest = ["templates/*.j2"]
