[project]
name = "concert-digest"
version = "0.2.0"
description = "MCP tools for a Grok bot to render Concertje-styled concert emails: critics' picks playing Belgium."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
concert-digest-mcp = "concert_digest.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["concert_digest*"]

[tool.setuptools.package-data]
concert_digest = ["templates/*.j2"]
